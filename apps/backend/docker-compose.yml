name: kedv00
services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: quacker
      POSTGRES_PASSWORD: quacker
      POSTGRES_DB: kedv00
    ports:
      - 5434:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quacker -d kedv00']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
